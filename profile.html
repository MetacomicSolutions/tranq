<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fake Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Roboto', sans-serif;
    }

    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .profile-card {
      background-color: #000000;
      width: 350px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      padding: 30px 20px;
      text-align: center;
    }

    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #007bff;
      margin-bottom: 20px;
    }

    .name {
      font-size: 24px;
      font-weight: 700;
      color: #333;
    }

    .job-title {
      font-size: 16px;
      color: #666;
      margin-bottom: 15px;
    }

    .bio {
      font-size: 14px;
      color: #555;
      margin-bottom: 20px;
    }

    .social-links a {
      margin: 0 10px;
      text-decoration: none;
      font-size: 20px;
      color: #007bff;
      transition: color 0.3s;
    }

    .social-links a:hover {
      color: #0056b3;
    }
  </style>
  <!-- Font Awesome for icons -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

  <div class="profile-card">
    <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Profile Picture" class="profile-img">
    <div class="name">John Doe</div>
    <div class="job-title">Frontend Developer</div>
    <div class="bio">
      Passionate about creating interactive applications and experiences on the web. Loves coffee and clean code.
 
    <div class="social-links">
      <a href="#"><i class="fab fa-twitter"></i></a>
      <a href="#"><i class="fab fa-linkedin"></i></a>
      <a href="#"><i class="fab fa-github"></i></a>
    </div>
  </div>

</body>
</html>
